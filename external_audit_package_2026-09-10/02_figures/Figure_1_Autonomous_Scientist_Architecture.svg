<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1450" viewBox="0 0 2000 1450">
  <defs>
    <style>
      .title{font:700 42px Arial,sans-serif;fill:#101828}.subtitle{font:400 22px Arial,sans-serif;fill:#475467}
      .panel{font:700 24px Arial,sans-serif;letter-spacing:1.2px}.label{font:700 22px Arial,sans-serif;fill:#101828}
      .body{font:400 19px Arial,sans-serif;fill:#475467}.small{font:400 17px Arial,sans-serif;fill:#667085}
      .tiny{font:400 15px Arial,sans-serif;fill:#667085}.white{fill:#fff}.center{text-anchor:middle}.right{text-anchor:end}
    </style>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#101828" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#475467"/></marker>
    <marker id="bluearrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1570EF"/></marker>
    <marker id="greenarrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#039855"/></marker>
    <marker id="purplearrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7F56D9"/></marker>
    <marker id="orangearrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#F79009"/></marker>
  </defs>

  <rect width="2000" height="1450" fill="#FFFFFF"/>
  <text x="54" y="62" class="title">Architecture for autonomy closure</text>
  <text x="54" y="98" class="subtitle">Goal, search, epistemic, recovery, claim and operational closure connect an objective to an evidence-authorized outcome.</text>

  <!-- Human objective -->
  <rect x="48" y="148" width="250" height="220" rx="24" fill="#101828" filter="url(#shadow)"/>
  <text x="173" y="194" class="panel white center">HUMAN SCIENTIST</text>
  <text x="173" y="245" class="label white center">Root objective</text>
  <text x="173" y="280" class="body white center">claim and metric</text>
  <text x="173" y="313" class="body white center">resource budget</text>
  <text x="173" y="346" class="body white center">stop conditions</text>
  <path d="M298 258 H346" fill="none" stroke="#475467" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Main system -->
  <rect x="350" y="126" width="1304" height="1255" rx="30" fill="#F8FAFC" stroke="#D0D5DD" stroke-width="2.5"/>
  <text x="386" y="170" class="panel" fill="#344054">AUTONOMOUS RESEARCH SYSTEM</text>

  <!-- A Program layer -->
  <rect x="386" y="198" width="970" height="285" rx="22" fill="#EFF8FF" stroke="#84CAFF" stroke-width="2.5"/>
  <text x="418" y="238" class="panel" fill="#175CD3">A  GOAL CLOSURE</text>
  <rect x="420" y="267" width="238" height="167" rx="18" fill="#FFFFFF" stroke="#53B1FD" stroke-width="2" filter="url(#shadow)"/>
  <text x="539" y="307" class="label center">Program manager</text>
  <text x="539" y="342" class="body center">allocates finite budget</text>
  <text x="539" y="373" class="body center">expands, parks or kills</text>
  <text x="539" y="404" class="body center">selects executable leaves</text>

  <text x="818" y="276" class="small center">dynamic AND OR goal graph</text>
  <circle cx="818" cy="320" r="39" fill="#175CD3"/>
  <text x="818" y="316" class="label white center">ROOT</text>
  <text x="818" y="340" class="tiny white center">metric</text>
  <path d="M789 346 L728 382" fill="none" stroke="#1570EF" stroke-width="3.5" marker-end="url(#bluearrow)"/>
  <path d="M847 346 L908 382" fill="none" stroke="#1570EF" stroke-width="3.5" marker-end="url(#bluearrow)"/>
  <rect x="662" y="385" width="135" height="55" rx="13" fill="#FFFFFF" stroke="#53B1FD" stroke-width="2"/>
  <rect x="842" y="385" width="135" height="55" rx="13" fill="#FFFFFF" stroke="#53B1FD" stroke-width="2"/>
  <text x="730" y="419" class="body center">decomp A</text>
  <text x="910" y="419" class="body center">decomp B</text>
  <path d="M797 412 H842" fill="none" stroke="#98A2B3" stroke-width="2.5" stroke-dasharray="7 6"/>
  <path d="M730 440 L704 459" fill="none" stroke="#1570EF" stroke-width="3" marker-end="url(#bluearrow)"/>
  <path d="M910 440 L936 459" fill="none" stroke="#1570EF" stroke-width="3" marker-end="url(#bluearrow)"/>
  <circle cx="690" cy="463" r="10" fill="#53B1FD"/>
  <circle cx="950" cy="463" r="10" fill="#53B1FD"/>
  <circle cx="820" cy="463" r="10" fill="#7F56D9"/>
  <path d="M730 440 L812 459" fill="none" stroke="#7F56D9" stroke-width="2.5" stroke-dasharray="6 5"/>
  <path d="M910 440 L828 459" fill="none" stroke="#7F56D9" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="1055" y="307" class="label">Composition rules</text>
  <text x="1055" y="340" class="body">all  any  at least  pareto</text>
  <text x="1055" y="376" class="label">Typed dependencies</text>
  <text x="1055" y="409" class="body">requires  supports  invalidates</text>
  <text x="1324" y="445" class="tiny right">each parent edge has its own integration test</text>
  <path d="M658 350 C700 350 730 323 776 320" fill="none" stroke="#1570EF" stroke-width="3.5" marker-end="url(#bluearrow)"/>

  <!-- selected leaf connection -->
  <path d="M820 483 V523" fill="none" stroke="#7F56D9" stroke-width="5" marker-end="url(#purplearrow)"/>
  <text x="842" y="510" class="small">selected falsifiable leaf</text>

  <!-- B Leaf lifecycle -->
  <rect x="386" y="525" width="970" height="242" rx="22" fill="#F9F5FF" stroke="#B692F6" stroke-width="2.5"/>
  <text x="418" y="565" class="panel" fill="#6941C6">B  EPISTEMIC CLOSURE</text>
  <g filter="url(#shadow)">
    <rect x="420" y="595" width="205" height="120" rx="16" fill="#FFFFFF" stroke="#9E77ED" stroke-width="2"/>
    <rect x="650" y="595" width="205" height="120" rx="16" fill="#FFFFFF" stroke="#9E77ED" stroke-width="2"/>
    <rect x="880" y="595" width="205" height="120" rx="16" fill="#FFFFFF" stroke="#9E77ED" stroke-width="2"/>
    <rect x="1110" y="595" width="210" height="120" rx="16" fill="#FFFFFF" stroke="#9E77ED" stroke-width="2"/>
  </g>
  <text x="523" y="630" class="label center">Frame</text>
  <text x="523" y="662" class="small center">mission  prior art</text><text x="523" y="687" class="small center">incumbent reproduction</text>
  <text x="753" y="630" class="label center">Explain</text>
  <text x="753" y="662" class="small center">phenomenon  diagnosis</text><text x="753" y="687" class="small center">concept invention</text>
  <text x="983" y="630" class="label center">Test</text>
  <text x="983" y="662" class="small center">concept validation</text><text x="983" y="687" class="small center">discriminating experiment</text>
  <text x="1215" y="630" class="label center">Build and judge</text>
  <text x="1215" y="662" class="small center">mechanism  evaluation</text><text x="1215" y="687" class="small center">decision  terminal report</text>
  <path d="M625 655 H650" fill="none" stroke="#7F56D9" stroke-width="3.5" marker-end="url(#purplearrow)"/>
  <path d="M855 655 H880" fill="none" stroke="#7F56D9" stroke-width="3.5" marker-end="url(#purplearrow)"/>
  <path d="M1085 655 H1110" fill="none" stroke="#7F56D9" stroke-width="3.5" marker-end="url(#purplearrow)"/>
  <text x="870" y="745" class="small center">Every transition requires a typed artifact and a prospective decision rule</text>

  <!-- C Discovery portfolio -->
  <path d="M870 767 V803" fill="none" stroke="#1570EF" stroke-width="5" marker-end="url(#bluearrow)"/>
  <rect x="386" y="805" width="970" height="300" rx="22" fill="#FFF6ED" stroke="#FDB022" stroke-width="2.5"/>
  <text x="418" y="845" class="panel" fill="#B54708">C  SEARCH CLOSURE</text>
  <text x="1324" y="844" class="tiny right">information isolated reference strategy  domain packs may substitute channels</text>
  <g filter="url(#shadow)">
    <rect x="420" y="880" width="245" height="150" rx="17" fill="#FFFFFF" stroke="#F79009" stroke-width="2"/>
    <rect x="710" y="880" width="245" height="150" rx="17" fill="#FFFFFF" stroke="#F79009" stroke-width="2"/>
    <rect x="1000" y="880" width="320" height="150" rx="17" fill="#FFFFFF" stroke="#F79009" stroke-width="2"/>
  </g>
  <text x="543" y="921" class="label center">Incremental ancestry</text>
  <text x="543" y="956" class="body center">incumbent code and errors</text>
  <text x="543" y="987" class="small center">exploits known mechanisms</text>
  <text x="833" y="921" class="label center">De novo</text>
  <text x="833" y="956" class="body center">problem contract only</text>
  <text x="833" y="987" class="small center">no incumbent ancestry</text>
  <text x="1160" y="921" class="label center">Delayed hybrid</text>
  <text x="1160" y="956" class="body center">opens after isolation period</text>
  <text x="1160" y="987" class="small center">must combine surviving parents</text>
  <line x1="687" y1="875" x2="687" y2="1038" stroke="#D92D20" stroke-width="3" stroke-dasharray="9 7"/>
  <line x1="977" y1="875" x2="977" y2="1038" stroke="#D92D20" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="687" y="1062" class="tiny center" fill="#B42318">exposure boundary</text>
  <text x="977" y="1062" class="tiny center" fill="#B42318">delayed exchange</text>
  <path d="M543 1030 C650 1092 1025 1092 1120 1030" fill="none" stroke="#F79009" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#orangearrow)"/>
  <path d="M833 1030 C900 1072 1040 1072 1100 1030" fill="none" stroke="#F79009" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#orangearrow)"/>

  <!-- Cross-cutting authority -->
  <rect x="1380" y="198" width="238" height="907" rx="22" fill="#ECFDF3" stroke="#32D583" stroke-width="2.5"/>
  <text x="1499" y="238" class="panel center" fill="#027A48">D  RECOVERY AND</text>
  <text x="1499" y="268" class="panel center" fill="#027A48">CLAIM CLOSURE</text>
  <text x="1499" y="306" class="small center">model independent control</text>
  <g filter="url(#shadow)">
    <rect x="1407" y="336" width="184" height="83" rx="13" fill="#FFFFFF" stroke="#12B76A" stroke-width="2"/>
    <rect x="1407" y="441" width="184" height="83" rx="13" fill="#FFFFFF" stroke="#12B76A" stroke-width="2"/>
    <rect x="1407" y="546" width="184" height="83" rx="13" fill="#FFFFFF" stroke="#12B76A" stroke-width="2"/>
    <rect x="1407" y="651" width="184" height="83" rx="13" fill="#FFFFFF" stroke="#12B76A" stroke-width="2"/>
    <rect x="1407" y="756" width="184" height="83" rx="13" fill="#FFFFFF" stroke="#12B76A" stroke-width="2"/>
    <rect x="1407" y="861" width="184" height="83" rx="13" fill="#FFFFFF" stroke="#12B76A" stroke-width="2"/>
  </g>
  <text x="1499" y="370" class="label center">Mission and</text><text x="1499" y="398" class="small center">graph policy</text>
  <text x="1499" y="475" class="label center">Plan and budget</text><text x="1499" y="503" class="small center">admissibility</text>
  <text x="1499" y="580" class="label center">Information</text><text x="1499" y="608" class="small center">exposure control</text>
  <text x="1499" y="685" class="label center">Evidence</text><text x="1499" y="713" class="small center">validation</text>
  <text x="1499" y="790" class="label center">Typed recovery</text><text x="1499" y="818" class="small center">and succession</text>
  <text x="1499" y="895" class="label center">Promotion and</text><text x="1499" y="923" class="small center">stopping</text>
  <text x="1499" y="986" class="small center">Workers may propose actions</text>
  <text x="1499" y="1012" class="small center">They cannot certify them</text>
  <path d="M1380 350 H1356" fill="none" stroke="#039855" stroke-width="4" marker-end="url(#greenarrow)"/>
  <path d="M1380 645 H1356" fill="none" stroke="#039855" stroke-width="4" marker-end="url(#greenarrow)"/>
  <path d="M1380 950 H1356" fill="none" stroke="#039855" stroke-width="4" marker-end="url(#greenarrow)"/>

  <!-- Memory -->
  <rect x="386" y="1132" width="1232" height="205" rx="22" fill="#FFFFFF" stroke="#98A2B3" stroke-width="2.5"/>
  <text x="418" y="1173" class="panel" fill="#344054">E  OPERATIONAL CLOSURE</text>
  <text x="418" y="1214" class="label">Hash chained event ledger</text>
  <text x="418" y="1248" class="body">actor  authority scope  tool calls  artifacts  costs  state transition</text>
  <text x="418" y="1292" class="label">Causal memory</text>
  <text x="418" y="1326" class="body">hypotheses  predictions  contradictions  exhausted interventions  experiment fingerprints</text>
  <path d="M1310 1202 C1235 1202 1225 465 1356 465" fill="none" stroke="#7F56D9" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#purplearrow)"/>
  <text x="1285" y="1117" class="small right">replayable state feeds every new decision</text>

  <!-- External actors and outputs -->
  <rect x="1694" y="148" width="258" height="245" rx="22" fill="#EFF8FF" stroke="#84CAFF" stroke-width="2.5"/>
  <text x="1823" y="190" class="panel center" fill="#175CD3">REPLACEABLE</text>
  <text x="1823" y="220" class="panel center" fill="#175CD3">WORKERS</text>
  <text x="1823" y="267" class="label center">Models and agents</text>
  <text x="1823" y="303" class="body center">literature  hypotheses</text>
  <text x="1823" y="334" class="body center">code  interpretation</text>
  <text x="1823" y="370" class="small center">proposal authority only</text>
  <path d="M1694 300 H1655" fill="none" stroke="#1570EF" stroke-width="4" marker-end="url(#bluearrow)"/>

  <rect x="1694" y="425" width="258" height="215" rx="22" fill="#FFF6ED" stroke="#FDB022" stroke-width="2.5"/>
  <text x="1823" y="467" class="panel center" fill="#B54708">DOMAIN PACK</text>
  <text x="1823" y="516" class="label center">Tools and instruments</text>
  <text x="1823" y="552" class="body center">retrieval  simulator</text>
  <text x="1823" y="583" class="body center">training  theorem prover</text>
  <text x="1823" y="614" class="small center">problem specific contracts</text>
  <path d="M1694 535 H1655" fill="none" stroke="#F79009" stroke-width="4" marker-end="url(#orangearrow)"/>

  <rect x="1694" y="672" width="258" height="242" rx="22" fill="#F9F5FF" stroke="#9E77ED" stroke-width="2.5"/>
  <text x="1823" y="714" class="panel center" fill="#6941C6">INDEPENDENT</text>
  <text x="1823" y="744" class="panel center" fill="#6941C6">PROVIDER</text>
  <text x="1823" y="792" class="label center">Sealed task authority</text>
  <text x="1823" y="829" class="body center">fresh entropy and truth</text>
  <text x="1823" y="860" class="body center">withheld until matched</text>
  <text x="1823" y="891" class="body center">terminals are immutable</text>
  <path d="M1694 804 H1618" fill="none" stroke="#7F56D9" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#purplearrow)"/>

  <path d="M1618 952 H1694" fill="none" stroke="#039855" stroke-width="5" marker-end="url(#greenarrow)"/>
  <rect x="1694" y="946" width="258" height="391" rx="22" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2.5"/>
  <text x="1823" y="988" class="panel center" fill="#344054">PROGRAM OUTCOME</text>
  <rect x="1722" y="1020" width="202" height="76" rx="14" fill="#ECFDF3" stroke="#12B76A" stroke-width="2"/>
  <text x="1823" y="1066" class="label center">Validated advance</text>
  <rect x="1722" y="1120" width="202" height="76" rx="14" fill="#F2F4F7" stroke="#98A2B3" stroke-width="2"/>
  <text x="1823" y="1166" class="label center">Null or abstain</text>
  <rect x="1722" y="1220" width="202" height="82" rx="14" fill="#FFF1F3" stroke="#FDA4AF" stroke-width="2"/>
  <text x="1823" y="1255" class="label center">Kill or reframe</text>
  <text x="1823" y="1282" class="small center">then update goal graph</text>
  <path d="M1722 1263 C1640 1362 1240 1410 860 1360" fill="none" stroke="#7F56D9" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#purplearrow)"/>

  <text x="52" y="1420" class="small" fill="#B42318">Canonical state changes only through validated artifacts. Failed branches remain in memory and constrain future graph expansion.</text>
</svg>
